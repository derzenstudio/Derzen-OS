# Ships supabase/functions/** to the Supabase project. Until this workflow
# existed nothing deployed Edge Functions at all: the copy running on
# hlurxysjoteionimgwli was uploaded by hand and could drift arbitrarily from
# the copy in this repo, so every "fix" to ai-proxy/index.ts was un-shipped.
#
# Required repository secret (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN   a personal access token from
#                           supabase.com/dashboard/account/tokens
#
# Provider API keys are NOT set here. They live in Supabase Edge Function
# Secrets (Project Settings > Edge Functions > Secrets) and are entered by
# hand: GROQ_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY and the optional
# *_MODEL overrides. Nothing billable belongs in this repo or in a VITE_ var.

name: deploy-functions

on:
  push:
    branches:
      - "**"
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

concurrency:
  # Separate from the FTP group in deploy.yml: a function deploy touches
  # Supabase only and must never queue behind, or block, a site upload.
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Fail before installing anything if the token is missing, otherwise the
      # CLI fails several minutes later with an opaque 401.
      - name: Verify SUPABASE_ACCESS_TOKEN exists
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create one at supabase.com/dashboard/account/tokens and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # `version: latest` made the action resolve the newest release through
      # the unauthenticated GitHub API, which rate-limits shared runner IPs -
      # run #5 died on exactly that. The redirect below is a plain download
      # with no API call, so it cannot be rate limited.
      - name: Setup Supabase CLI
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version

      # Every directory under supabase/functions is a function. They used to
      # be listed here one at a time, and only ai-proxy ever was: checkout and
      # payment-webhook sat in the repository undeployed, so the pricing page
      # called a function that did not exist and the buyer saw a transport
      # error instead of an answer. The loop means adding a function is adding
      # a directory, nothing else.
      #
      # No --no-verify-jwt: the gateway keeps rejecting callers that present no
      # Supabase key at all. Each function decides for itself what a bare anon
      # key may do; that tiering belongs in the function, not in the gateway.
      - name: Deploy every function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -eu
          shipped=0
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*) echo "skipping shared directory $name"; continue;; esac
            if [ ! -f "$dir/index.ts" ]; then
              echo "::warning::$name has no index.ts, skipping"
              continue
            fi
            echo "::group::deploy $name"
            supabase functions deploy "$name" --project-ref hlurxysjoteionimgwli
            echo "::endgroup::"
            shipped=$((shipped + 1))
          done
          echo "deployed $shipped function(s)"
          if [ "$shipped" -eq 0 ]; then
            echo "::error::No functions were deployed. That is never correct here."
            exit 1
          fi
