# Builds the Vite app and publishes dist/ to dev.alvianpermana.art on Hostinger.
#
# The deploy uses a dedicated, scoped FTP account whose root IS the site folder
# (/home/u157847892/domains/alvianpermana.art/public_html/derzen), so the upload
# target is simply "./".
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    ftp.alvianpermana.art
#   FTP_USERNAME  the scoped FTP account username
#   FTP_PASSWORD  that account's password
#
# Optional repository variable (same page, "Variables" tab):
#   FTP_SERVER_DIR  overrides the upload target, defaults to ./
#
# Every push to a branch that contains this file wipes the target folder and
# uploads a fresh build, so the live site always mirrors the latest commit.

name: deploy-dev

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

concurrency:
    # Both deploy workflows push over FTP to the same Hostinger account, which
  # tolerates only one session at a time — share the group so they queue
  # instead of racing and timing out on the control socket.
  group: hostinger-ftp
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Build
        env:
          VITE_SURFACE: dev
        run: npm run build

      - name: SPA fallback + keep dev site out of search engines
        run: |
          cp dist/index.html dist/404.html
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Verify FTP secrets exist
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::error::Missing FTP secrets. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy to Hostinger (dev.alvianpermana.art)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: true
