# Builds the Vite app once per surface and publishes dist/ to Hostinger:
#   surface=app  →  app.alvianpermana.art  (tenant + marketing)   every run
#   surface=dev  →  dev.alvianpermana.art  (internal consoles)    every run
#
# Branch policy: every push (any branch) and every manual dispatch deploys
# BOTH surfaces, app first and dev second, strictly one at a time. Feature-
# branch pushes therefore DO redeploy production (app) - no main-only gate.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER        ftp.alvianpermana.art   (shared by both surfaces)
#   FTP_USERNAME_APP  the derzen_app-scoped FTP account username
#   FTP_PASSWORD_APP  that account's password
#   FTP_USERNAME      the derzen (dev) scoped FTP account username
#   FTP_PASSWORD      that account's password
#   VITE_SUPABASE_URL       the Supabase project URL, baked into the bundle
#   VITE_SUPABASE_ANON_KEY  the anon key; public by design, RLS is the real guard
#
# Optional repository variables (Variables tab):
#   FTP_SERVER_DIR_APP / FTP_SERVER_DIR  override upload targets, default ./
#
# dangerous-clean-slate is OFF: FTP-Deploy-Action's sync-state file performs
# incremental uploads, so there is no wipe-then-reupload window.

name: deploy

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

concurrency:
  # Both surfaces upload over FTP to the same Hostinger account, which
  # tolerates only one session at a time — share the group so the matrix
  # legs queue instead of racing and timing out on the control socket.
  group: hostinger-ftp
  cancel-in-progress: false

jobs:
  # The matrix context is NOT in scope in a job-level "if", so the surface
  # list is decided here and consumed with fromJSON instead. Order matters:
  # app is listed first so it deploys before dev under max-parallel: 1.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick surfaces to deploy
        id: pick
        run: |
          APP='{"surface":"app","ftp_user_key":"FTP_USERNAME_APP","ftp_pass_key":"FTP_PASSWORD_APP","server_dir_var":"FTP_SERVER_DIR_APP","robots_allow":true}'
          DEV='{"surface":"dev","ftp_user_key":"FTP_USERNAME","ftp_pass_key":"FTP_PASSWORD","server_dir_var":"FTP_SERVER_DIR","robots_allow":false}'
          echo "matrix={\"include\":[$APP,$DEV]}" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both legs upload over FTP to the same Hostinger account, which
      # tolerates only one session at a time, so run them back to back.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      # Fail fast: validate ALL THREE secrets before spending minutes building.
      - name: Verify FTP secrets exist
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets[matrix.ftp_user_key] }}
          FTP_PASSWORD: ${{ secrets[matrix.ftp_pass_key] }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Missing FTP secrets for surface '${{ matrix.surface }}'. Add FTP_SERVER, ${{ matrix.ftp_user_key }} and ${{ matrix.ftp_pass_key }} under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Install dependencies with strict npm ci: it installs exactly the tree
      # in package-lock.json and refuses to silently reconcile drift, so two
      # runs of the same commit always build identical bytes. The lockfile is
      # regenerated by the separate "Refresh lockfile" workflow whenever
      # package.json changes - do not downgrade this to `npm install` to work
      # around a stale lock, run that workflow instead.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Typecheck gate. Uses the repo's own script (tsc --noEmit against the
      # root tsconfig.json). NOTE: this codebase has never been typechecked in
      # CI — if this step surfaces pre-existing errors, run `npm run typecheck`
      # locally and clear them rather than removing the gate.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_SURFACE: ${{ matrix.surface }}
          # Baked into the static bundle at build time. Without these two the
          # app falls back to browser-only mode and Supabase auth stays inert.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # npm run build also bundles server.ts to dist/server.cjs so the app can
      # be run behind Node. These hosts are plain static Apache: the file is
      # never executed there, it is only downloadable, and it was. Internal
      # server source has no business on either surface, so it is dropped
      # before anything is uploaded. The .map beside it goes with it.
      - name: Drop the Node server bundle from the upload
        run: |
          rm -f dist/server.cjs dist/server.cjs.map
          if ls dist/*.cjs >/dev/null 2>&1; then
            echo "::error::A .cjs file is still in dist and would be published."
            exit 1
          fi

      # app: explicit allow (was shipping no robots.txt at all).
      # dev: keep the internal console out of search engines.
      - name: SPA fallback + robots.txt
        run: |
          cp dist/index.html dist/404.html
          if [ "${{ matrix.robots_allow }}" = "true" ]; then
            printf 'User-agent: *\nAllow: /\n' > dist/robots.txt
          else
            printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          fi

      # deploy/htaccess.{app,dev} carry the ONLY server-enforced rules on this
      # stack: CSP, HSTS, X-Frame-Options, nosniff, Permissions-Policy, the SPA
      # rewrite, and the cache policy. They must reach Hostinger on every run,
      # so a missing file fails the deploy rather than shipping an unprotected
      # surface with a badly cached entry document.
      - name: Install surface .htaccess
        env:
          DEV_HTPASSWD_PATH: ${{ secrets.DEV_HTPASSWD_PATH }}
          DEV_ACCESS_TOKEN: ${{ secrets.DEV_ACCESS_TOKEN }}
        run: |
          src="deploy/htaccess.${{ matrix.surface }}"
          if [ ! -f "$src" ]; then
            echo "::error::$src is missing - refusing to deploy without server headers."
            exit 1
          fi
          cp "$src" dist/.htaccess

          # The internal surface must never hand its bundle to a visitor who
          # has not been let in. Three walls, best first, and the last one is
          # fail closed: a missing secret seals the host instead of quietly
          # publishing the console the way the old CHANGEME placeholder did.
          if [ "${{ matrix.surface }}" = "dev" ]; then
            wall="${RUNNER_TEMP:-/tmp}/dev-wall.conf"
            if [ -n "$DEV_HTPASSWD_PATH" ]; then
              printf '%s\n' \
                'AuthType Basic' \
                'AuthName "DERZEN internal"' \
                "AuthUserFile $DEV_HTPASSWD_PATH" \
                'Require valid-user' > "$wall"
              mode=basic
              echo "Wall: HTTP basic auth against $DEV_HTPASSWD_PATH."
            elif [ -n "$DEV_ACCESS_TOKEN" ]; then
              case "$DEV_ACCESS_TOKEN" in
                *[!A-Za-z0-9]*)
                  echo "::error::DEV_ACCESS_TOKEN must be letters and digits only, it is substituted into a rewrite condition."
                  exit 1
                  ;;
              esac
              printf '%s\n' \
                '# Shared phrase wall. gate.html and gate.js are the only two' \
                '# files served without the cookie, and neither one carries' \
                '# the phrase.' \
                'RewriteCond %{REQUEST_URI} !^/gate\.(html|js)$' \
                "RewriteCond %{HTTP_COOKIE} !(^|;[ ]*)derzen_dev=$DEV_ACCESS_TOKEN([ ]*;|\$)" \
                'RewriteRule ^ /gate.html [L]' > "$wall"
              mode=token
              echo "Wall: shared phrase carried in the derzen_dev cookie."
            else
              printf '%s\n' \
                '# Sealed. No wall secret was supplied, so no internal asset' \
                '# is served to anyone at all.' \
                'RewriteCond %{REQUEST_URI} !^/gate\.(html|js)$' \
                'RewriteRule ^ /gate.html [L]' > "$wall"
              mode=sealed
              echo "::warning::Neither DEV_HTPASSWD_PATH nor DEV_ACCESS_TOKEN is set, so dev.alvianpermana.art ships sealed: every request is answered with gate.html and the internal bundle is not downloadable by anyone. Set either secret and run this workflow again to open it."
            fi
            sed -i "/@@DEV_WALL@@/r $wall" dist/.htaccess
            sed -i "/@@DEV_WALL@@/d" dist/.htaccess
            sed "s/@@MODE@@/$mode/" deploy/dev-gate.html > dist/gate.html
            cp deploy/dev-gate.js dist/gate.js
            echo "Gate page installed, mode $mode."
          fi

          if grep -q "CHANGEME\|@@DEV_WALL@@\|@@MODE@@" dist/.htaccess dist/*.html; then
            echo "::error::A placeholder survived into dist - refusing to ship it."
            exit 1
          fi
          echo "Installed $src as dist/.htaccess ($(wc -c < dist/.htaccess) bytes)"

      # Hostinger's FTP control socket sometimes refuses the first connection
      # of a run; the action then gives up after its 30s default and the whole
      # production deploy is lost. Raise that ceiling and retry once - the
      # sync-state file makes a second pass idempotent, so the retry re-uploads
      # only what is still missing.
      - name: Deploy to Hostinger (${{ matrix.surface }}.alvianpermana.art)
        id: ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets[matrix.ftp_user_key] }}
          password: ${{ secrets[matrix.ftp_pass_key] }}
          local-dir: ./dist/
          server-dir: ${{ vars[matrix.server_dir_var] || './' }}
          timeout: 120000

      - name: Cool off before retry
        if: steps.ftp.outcome == 'failure'
        run: sleep 20

      - name: Deploy to Hostinger, retry (${{ matrix.surface }}.alvianpermana.art)
        id: ftp_retry
        continue-on-error: true
        if: steps.ftp.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets[matrix.ftp_user_key] }}
          password: ${{ secrets[matrix.ftp_pass_key] }}
          local-dir: ./dist/
          server-dir: ${{ vars[matrix.server_dir_var] || './' }}
          timeout: 120000

      # Hostinger sometimes refuses connections for a whole minute rather than
      # for a single attempt. Run 31 lost the dev leg because both passes landed
      # inside the same short outage, while the app leg - which ran earlier -
      # went through untouched. One more attempt after a longer pause turns that
      # class of failure into a slow deploy instead of a lost one. Every pass is
      # idempotent: the action keeps a sync-state file on the server and
      # re-uploads only what is still missing.
      - name: Cool off before the final attempt
        if: steps.ftp.outcome == 'failure' && steps.ftp_retry.outcome == 'failure'
        run: sleep 60

      - name: Deploy to Hostinger, final attempt (${{ matrix.surface }}.alvianpermana.art)
        if: steps.ftp.outcome == 'failure' && steps.ftp_retry.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets[matrix.ftp_user_key] }}
          password: ${{ secrets[matrix.ftp_pass_key] }}
          local-dir: ./dist/
          server-dir: ${{ vars[matrix.server_dir_var] || './' }}
          timeout: 120000
