# Builds the Vite app and publishes dist/ to dev.alvianpermana.art on Hostinger.
#
# Required repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   FTP_SERVER    e.g. 153.92.10.17
#   FTP_USERNAME  e.g. u157847892.alvianpermana.art
#   FTP_PASSWORD  your Hostinger FTP password
#
# Optional repository variable (same page, "Variables" tab):
#   FTP_SERVER_DIR  target folder, defaults to public_html/derzen/
#                   set it to derzen/ if the FTP login already lands inside public_html
#
# Every push to a branch that contains this file wipes the target folder and
# uploads a fresh build, so the live site always mirrors the latest commit.

name: deploy-dev

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: SPA fallback + keep dev site out of search engines
        run: |
          cp dist/index.html dist/404.html
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Verify FTP secrets exist
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::error::Missing FTP secrets. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy to Hostinger (dev.alvianpermana.art)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/derzen/' }}
          dangerous-clean-slate: true
