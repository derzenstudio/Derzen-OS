# Builds the Vite app for the TENANT surface and publishes dist/ to
# app.alvianpermana.art on Hostinger.
#
# The deploy uses a dedicated, scoped FTP account whose root IS the site folder
# (/home/u157847892/domains/alvianpermana.art/public_html/derzen_app), so the
# upload target is simply "./".
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER        ftp.alvianpermana.art   (shared with deploy-dev)
#   FTP_USERNAME_APP  the derzen_app-scoped FTP account username
#   FTP_PASSWORD_APP  that account's password
#
# Optional repository variable (same page, "Variables" tab):
#   FTP_SERVER_DIR_APP  overrides the upload target, defaults to ./
#
# Every push to a branch that contains this file wipes the target folder and
# uploads a fresh build, so the live site always mirrors the latest commit.

name: deploy-app

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

concurrency:
  # Both deploy workflows push over FTP to the same Hostinger account, which
# tolerates only one session at a time — share the group so they queue
# instead of racing and timing out on the control socket.
  group: hostinger-ftp
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Fail fast: no point building for six minutes if we cannot upload.
      - name: Verify FTP secrets exist
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME_APP: ${{ secrets.FTP_USERNAME_APP }}
          FTP_PASSWORD_APP: ${{ secrets.FTP_PASSWORD_APP }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME_APP" ] || [ -z "$FTP_PASSWORD_APP" ]; then
            echo "::error::Missing FTP secrets. Add FTP_SERVER, FTP_USERNAME_APP and FTP_PASSWORD_APP under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Build
        env:
          VITE_SURFACE: app
        run: npm run build

      - name: SPA fallback
        run: |
          cp dist/index.html dist/404.html

      - name: Deploy to Hostinger (app.alvianpermana.art)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_APP }}
          password: ${{ secrets.FTP_PASSWORD_APP }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR_APP || './' }}
          dangerous-clean-slate: true
