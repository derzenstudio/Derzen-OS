<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <title>DERZEN internal</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a0a;
        color: #ededed;
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      main { width: 100%; max-width: 420px; }
      .eyebrow {
        margin: 0 0 20px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8a8a8a;
      }
      h1 { margin: 0 0 12px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0 0 20px; color: #a3a3a3; }
      label { display: block; margin-bottom: 8px; font-size: 13px; color: #ededed; }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #2e2e2e;
        border-radius: 8px;
        background: #141414;
        color: #ededed;
        font: inherit;
      }
      input:focus { outline: 2px solid #4b4bff; outline-offset: 1px; }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: #ededed;
        color: #0a0a0a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .note { margin-top: 20px; font-size: 12px; color: #737373; }
    </style>
  </head>
  <body data-mode="@@MODE@@">
    <main>
      <p class="eyebrow">DERZEN &middot; internal surface</p>
      <h1 id="head">This host is closed</h1>
      <p id="blurb">Checking how this deployment is protected.</p>
      <form id="gate" hidden>
        <label for="key">Access phrase</label>
        <input id="key" type="password" autocomplete="current-password" spellcheck="false" />
        <button type="submit">Unlock this browser</button>
      </form>
      <p class="note" id="note"></p>
    </main>
    <script src="/gate.js"></script>
  </body>
</html>
